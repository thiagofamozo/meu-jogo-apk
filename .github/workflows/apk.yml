name: Gerar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Chave oficial (se existir)
        env:
          K: ${{ secrets.APK_KEYSTORE }}
        run: |
          if [ -n "$K" ]; then echo "$K" | base64 -d > $RUNNER_TEMP/smash.keystore; echo "APK_KEYSTORE_ARQ=$RUNNER_TEMP/smash.keystore" >> $GITHUB_ENV; fi
      - name: Colocar o jogo dentro do APK (baixa da VPS)
        env:
          GAME_URL: ${{ secrets.GAME_URL }}
        run: |
          set -e
          # endereco: segredo GAME_URL do GitHub; sem ele, desembaralha o game_url do strings.xml (mesma chave do Segredo.java)
          URL="$GAME_URL"
          if [ -z "$URL" ]; then URL=$(python3 -c "import re,base64;s=open('app/src/main/res/values/strings.xml',encoding='utf-8').read();g=re.search(r'name=.game_url.>([^<]+)<',s).group(1).strip();K=[0x53,0x6d,0x57,0x21,0x67,0x30,0x23,0x6b,0x39,0x14,0x7e,0x2c];b=g if g.startswith('http') else bytes((c^K[i%12]^(i*7))&255 for i,c in enumerate(base64.b64decode(g))).decode();print(b.rstrip('/'))"); fi
          echo "::add-mask::$URL"
          D=app/src/main/assets/jogo; mkdir -p $D
          curl -fsS --retry 3 "$URL/versao_app.json" -o app/src/main/assets/jogo_manifesto.json
          python3 - <<'PY'
          import json, urllib.parse
          a = json.load(open('app/src/main/assets/jogo_manifesto.json'))['arquivos']
          with open('lista.txt', 'w') as f:
              for k in a: f.write(k + '\n')
          print(len(a), 'arquivos', sum(v[0] for v in a.values()) // 1048576, 'MB')
          PY
          cat lista.txt | xargs -P 12 -I{} sh -c 'mkdir -p "$(dirname "app/src/main/assets/jogo/{}")"; curl -fsS --retry 3 -H "Accept-Encoding: identity" "'$URL'/$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "{}")" -o "app/src/main/assets/jogo/{}"'
          du -sh $D
      - name: Montar APK
        env:
          APK_SENHA: ${{ secrets.APK_SENHA }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Renomear
        run: cp app/build/outputs/apk/release/*.apk SmashWorldGO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SmashWorldGO-APK
          path: SmashWorldGO.apk
      - name: Publicar para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}${{ github.ref_name != 'main' && '-teste' || '' }}
          name: Smash World GO (versao ${{ github.run_number }})
          make_latest: ${{ github.ref_name == 'main' }}
          prerelease: ${{ github.ref_name != 'main' }}
          files: SmashWorldGO.apk
