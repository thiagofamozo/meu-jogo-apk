name: Gerar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Chave oficial (se existir)
        env:
          K: ${{ secrets.APK_KEYSTORE }}
        run: |
          if [ -n "$K" ]; then echo "$K" | base64 -d > $RUNNER_TEMP/smash.keystore; echo "APK_KEYSTORE_ARQ=$RUNNER_TEMP/smash.keystore" >> $GITHUB_ENV; fi
      - name: Montar APK
        env:
          APK_SENHA: ${{ secrets.APK_SENHA }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Renomear
        run: cp app/build/outputs/apk/release/*.apk SmashWorldGO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SmashWorldGO-APK
          path: SmashWorldGO.apk
      - name: Publicar para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Smash World GO (versao ${{ github.run_number }})
          make_latest: true
          files: SmashWorldGO.apk
