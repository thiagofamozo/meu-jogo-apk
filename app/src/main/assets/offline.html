<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1b2c;font-family:'Arial Black',Arial,sans-serif;color:#fff}
.bg{position:fixed;inset:0;background:#0d1b2c url(bg.jpg) center top/cover no-repeat}
.ver{position:fixed;top:6px;right:8px;font:bold 11px Arial;text-shadow:0 1px 2px #000}
.ui{position:fixed;left:0;right:0;bottom:4%;display:flex;flex-direction:column;align-items:center;gap:22px}
.bar{display:flex;align-items:center;gap:12px;min-width:270px;max-width:88vw;padding:9px 16px;border-radius:14px;background:rgba(20,30,55,.88);border:3px solid #ffd25a;font-size:16px;text-shadow:0 2px 0 #000,1px 0 #000,-1px 0 #000}
.st{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px}
.dot{width:11px;height:11px;border-radius:50%;background:#bbb}
.on .dot{background:#4fe05a;box-shadow:0 0 8px #4fe05a}.on .tx{color:#6ef27a}
.off .dot{background:#ff5045;box-shadow:0 0 8px #ff5045}.off .tx{color:#ff7a70}
.chk .dot{animation:p 1s infinite}@keyframes p{50%{opacity:.25}}
.btn{min-width:190px;padding:14px 30px;border:0;background:none;border-image:url(btn.png) 30 45 fill / 30px 45px;font:22px 'Arial Black',Arial;color:#fff8de;text-shadow:0 2px #6a3a00,1.5px 0 #6a3a00,-1.5px 0 #6a3a00,0 -1.5px #6a3a00;transition:transform .1s,filter .2s}
.btn:active{transform:scale(.95)}
.btn.dis{filter:grayscale(1) brightness(.85)}
.aviso{font:bold 12px Arial,sans-serif;text-align:center;line-height:1.5;color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 4px #000;padding:0 14px}
.msg{max-width:88vw;padding:9px 16px;border-radius:12px;background:rgba(10,14,28,.9);border:2px solid #ffd25a;font:bold 14px Arial,sans-serif;line-height:1.4;color:#fff;text-align:center;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000;box-shadow:0 3px 10px rgba(0,0,0,.6)}
.msg:empty{display:none}
.msg.erro{border-color:#ff5045;color:#ffe3e0}
.msg.erro::before{content:'⚠ ';color:#ffcc33}
.carga{display:none;width:86vw;max-width:420px;text-align:center}
.carga.on{display:block}
.carga .tt{font:bold 15px Arial,sans-serif;color:#fff;margin-bottom:7px;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 4px #000}
.trilho{position:relative;height:24px;border-radius:13px;background:rgba(10,14,28,.9);border:2px solid #ffd25a;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.6)}
.enche{height:100%;width:0;border-radius:11px;background:linear-gradient(#ffe98a,#ffb52e 55%,#e88a10);box-shadow:inset 0 2px 0 rgba(255,255,255,.55);transition:width .25s}
.pc{position:absolute;inset:0;line-height:20px;font:bold 13px Arial,sans-serif;color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.ocultar{display:none!important}
</style></head><body><div class="bg"></div><div class="ver" id="ver">v2.0</div>
<div class="ui">
 <div class="bar chk" id="sv"><span id="nm">Servidor</span><span class="st"><span class="dot"></span><span class="tx" id="tx">Verificando...</span></span></div>
 <div class="msg" id="msg"></div>
 <div class="carga" id="cg"><div class="tt" id="cgt">Atualizando...</div><div class="trilho"><div class="enche" id="cgb"></div><div class="pc" id="cgp">0%</div></div></div>
 <button class="btn dis" id="bt" onclick="jogar()">Iniciar jogo</button>
 <div class="aviso">Evite jogos nocivos e piratas. Proteja-se e cuidado com golpes.<br>Jogue com moderação: organize seu tempo e tenha uma vida saudável.</div>
</div>
<script>
var u='__URL__',on=false,host=(u.match(/^https?:\/\/([^\/:]+)/)||[])[1]||'';
function net(){try{if(window.SmashApp&&SmashApp.temInternet)return SmashApp.temInternet()}catch(e){}return navigator.onLine!==false}
var pronto_=false,siteOk=false,tentou=false;
function set(ok){on=ok;var semNet=!siteOk&&!net();
 document.getElementById('sv').className='bar '+(ok?'on':'off');
 document.getElementById('tx').textContent=ok?'ONLINE':(semNet?'SEM INTERNET':'OFFLINE');
 if(baixando)return;
 var bt=document.getElementById('bt');bt.textContent=pronto_?'Entrar no jogo':'Iniciar jogo';
 bt.className='btn'+((pronto_?ok:siteOk)?'':' dis');
 var mg=document.getElementById('msg'),t='';
 if(semNet)t='Sem conexão com a internet. Verifique seu Wi-Fi ou dados móveis e tente novamente.';
 else if(!ok)t=pronto_?'Jogo atualizado! Servidor em manutenção. Tente novamente mais tarde.':'Servidor em manutenção. Tente novamente mais tarde.';
 mg.className='msg'+(t?' erro':'');mg.textContent=t}
function fundo(f){try{document.querySelector('.bg').style.backgroundImage='url("'+f+'"),url(bg.jpg)'}catch(e){}}
function ws(cb){var d=false,w;function f(k){if(d)return;d=true;try{w.close()}catch(e){}cb(k)}try{w=new WebSocket('ws://'+host+':3020')}catch(e){return cb(false)}setTimeout(function(){f(false)},6000);w.onopen=function(){f(true)};w.onerror=function(){f(false)}}
function site(cb){var d=false,i=new Image();setTimeout(function(){if(!d){d=true;cb(false)}},6000);i.onload=function(){if(!d){d=true;cb(true)}};i.onerror=function(){if(!d){d=true;cb(false)}};i.src=u.replace(/\/?$/,'/')+'favicon.ico?p='+Date.now()}
function checar(){site(function(a){siteOk=a;if(a&&!pronto_&&!baixando&&!tentou){tentou=true;comecar()}if(!a)return set(false);ws(function(b){set(b)})})}
function comecar(){if(window.SmashApp&&SmashApp.atualizar){baixando=true;document.getElementById('bt').textContent='Verificando versão...';SmashApp.atualizar()}else{pronto_=true;set(on)}}
function pronto(){baixando=false;pronto_=true;var cb=document.getElementById('cgb');if(cb){cb.style.width='100%'}setTimeout(function(){document.getElementById('cg').className='carga';document.getElementById('bt').classList.remove('ocultar');set(on)},400)}
var baixando=false;
function mb(b){return (b/1048576).toFixed(b<10485760?1:0)+' MB'}
function progresso(n,t,b,tb,pri){baixando=true;var mg=document.getElementById('msg');mg.className='msg';mg.textContent='';
 document.getElementById('bt').classList.add('ocultar');document.getElementById('cg').className='carga on';
 var pc=tb>0?Math.floor(b*100/tb):Math.floor(n*100/Math.max(t,1));if(n>=t)pc=100;
 document.getElementById('cgb').style.width=pc+'%';document.getElementById('cgp').textContent=pc+'%';
 document.getElementById('cgt').textContent=(pri?'Baixando o jogo... ':'Atualizando... ')+n+'/'+t+' arquivos'}
function falhou(m){baixando=false;setTimeout(function(){set(on);document.getElementById('msg').className='msg erro';document.getElementById('msg').textContent=m},0);document.getElementById('cg').className='carga';document.getElementById('bt').classList.remove('ocultar');document.getElementById('msg').className='msg erro';var bt=document.getElementById('bt');bt.textContent='Iniciar jogo';bt.className='btn'+(on?'':' dis');document.getElementById('msg').textContent=m}
function jogar(){if(baixando)return;if(!pronto_){if(siteOk)comecar();else checar();return}if(on){document.getElementById('bt').textContent='Entrando...';if(window.SmashApp&&SmashApp.entrar)SmashApp.entrar();else location.href=u}else checar()}
try{if(window.SmashApp)document.getElementById('ver').textContent='v'+SmashApp.versaoApp()}catch(e){}
try{if(window.SmashApp&&SmashApp.fundoLocal){var fl=SmashApp.fundoLocal();if(fl)fundo(fl)}}catch(e){}
var vt=0;document.getElementById('ver').onclick=function(){if(++vt<5)return;vt=0;var mg=document.getElementById('msg');
 if(!window.SmashApp||!SmashApp.anuncioPronto()){mg.className='msg erro';mg.textContent='Teste de anúncio: '+(window.SmashApp?SmashApp.anuncioMotivo():'fora do app');return}
 window._smashAdFim=function(id,ok,m){mg.className='msg'+(ok?'':' erro');mg.textContent=ok?'✅ Teste OK: anúncio assistido até o fim!':'Teste de anúncio: '+m};SmashApp.mostrarAnuncio('teste')};
checar();setInterval(checar,5000);
</script></body></html>
