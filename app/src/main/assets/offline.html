<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Arial Black',Arial,sans-serif;color:#fff;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 20%,#5fb6ff 0%,#2d6fb8 40%,#123a6b 75%,#0a1f3d 100%);display:flex;flex-direction:column;align-items:center;justify-content:center}
.sun{position:fixed;top:-20vh;left:50%;width:120vw;height:60vh;transform:translateX(-50%);background:radial-gradient(#fff7,#fff0 60%)}
.hill{position:fixed;bottom:-30vh;left:-20vw;width:140vw;height:60vh;border-radius:50%;background:radial-gradient(ellipse at 50% 20%,#7fd04a,#3f8f22 60%,#2a6416)}
.logo{position:relative;text-align:center;margin-top:-8vh}
.logo img{width:120px;height:120px;border-radius:28px;border:5px solid #ffd54a;background:#fff3c4;box-shadow:0 6px 0 #a36d00,0 12px 30px #0008}
h1{margin:14px 0 0;font-size:38px;letter-spacing:1px;color:#ffd84a;text-shadow:0 3px 0 #7a3c00,2px 0 #7a3c00,-2px 0 #7a3c00,0 -2px #7a3c00,0 8px 16px #0008}
.card{position:relative;margin-top:26px;width:min(330px,86vw);padding:16px;border:6px solid #80bfdf;border-bottom-width:10px;border-bottom-color:#4586ad;border-radius:26px;background:#68a9d0;box-shadow:0 5px 0 #173849,0 14px 40px #0009;text-align:center}
.sv{display:flex;align-items:center;justify-content:space-between;background:#f6f0dc;border-radius:16px;border-bottom:4px solid #cfc6a6;padding:12px 14px;color:#6b3a1c;font-size:17px}
.st{display:flex;align-items:center;gap:7px;font-size:15px}
.dot{width:13px;height:13px;border-radius:50%;background:#aaa;box-shadow:0 0 0 3px #0001}
.on .dot{background:#3fd14a;box-shadow:0 0 10px #3fd14a}.on .tx{color:#1b8a3a}
.off .dot{background:#e8453c;box-shadow:0 0 10px #e8453c}.off .tx{color:#c62828}
.chk .dot{animation:pi 1s infinite}@keyframes pi{50%{opacity:.3}}
button{margin-top:14px;width:100%;padding:14px;border:0;border-radius:18px;font:24px 'Arial Black',Arial;color:#fff;cursor:pointer;transition:transform .1s}
button:active{transform:translateY(3px)}
.bon{background:linear-gradient(#8fe04a,#52b522);box-shadow:0 6px 0 #2f7a12;text-shadow:0 2px #2a5e10}
.boff{background:linear-gradient(#9aa5b1,#6b7684);box-shadow:0 6px 0 #3e4752;text-shadow:0 2px #333}
.msg{margin-top:12px;font:13px Arial,sans-serif;color:#eaf5ff;min-height:18px}
</style></head><body><div class="sun"></div><div class="hill"></div>
<div class="logo"><img src="avatar.png" alt=""><h1>Smash World GO</h1></div>
<div class="card"><div class="sv chk" id="sv"><span>Servidor</span><span class="st"><span class="dot"></span><span class="tx" id="tx">Verificando...</span></span></div>
<button id="bt" class="boff" onclick="jogar()">Aguarde...</button><div class="msg" id="msg"></div></div>
<script>
var u='__URL__',on=false,host=(u.match(/^https?:\/\/([^\/:]+)/)||[])[1]||'';
function set(ok){on=ok;var sv=document.getElementById('sv');sv.className='sv '+(ok?'on':'off');document.getElementById('tx').textContent=ok?'ONLINE':'OFFLINE';
 var b=document.getElementById('bt');b.className=ok?'bon':'boff';b.textContent=ok?'JOGAR':'Servidor offline';
 document.getElementById('msg').textContent=ok?'Tudo pronto! Toque em JOGAR.':'O servidor está desligado ou em manutenção. Verificando de novo sozinho...'}
function ws(cb){var d=false,w;function f(k){if(d)return;d=true;try{w.close()}catch(e){}cb(k)}try{w=new WebSocket('ws://'+host+':3020')}catch(e){return cb(false)}setTimeout(function(){f(false)},6000);w.onopen=function(){f(true)};w.onerror=function(){f(false)}}
function site(cb){var d=false,i=new Image();setTimeout(function(){if(!d){d=true;cb(false)}},6000);i.onload=function(){if(!d){d=true;cb(true)}};i.onerror=function(){if(!d){d=true;cb(false)}};i.src=u.replace(/\/?$/,'/')+'favicon.ico?p='+Date.now()}
function checar(){site(function(a){if(!a)return set(false);ws(function(b){set(b)})})}
function jogar(){if(on)location.href=u;else checar()}
checar();setInterval(checar,5000);
</script></body></html>
